name: Refresh data

# Every morning: new Egyptian results/fixtures from Kooora + EPL from football-data.co.uk and openfootball.
# Commits football.db only when the rows changed; Streamlit Cloud redeploys from main on that push.
on:
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC = 06:00 Cairo
  workflow_dispatch:       # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install pandas requests sqlalchemy

      - name: Hash before
        run: echo "BEFORE=$(python -c 'import pipeline; print(pipeline.content_hash())')" >> "$GITHUB_ENV"

      - name: Current Egyptian season (Kooora)
        run: python fetch_kooora.py

      - name: Rebuild database
        run: python pipeline.py

      - name: Commit if the data changed
        run: |
          AFTER=$(python -c 'import pipeline; print(pipeline.content_hash())')
          if [ "$AFTER" = "$BEFORE" ]; then
            echo "No new matches or fixtures."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add football.db
          git commit -m "Refresh data ($(date -u +%Y-%m-%d))"
          git push
